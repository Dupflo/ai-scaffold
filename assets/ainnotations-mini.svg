<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 170" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">
  <style>
    .scribble {
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
      animation: draw 9s linear infinite;
    }
    @keyframes draw {
      0%,12%  { stroke-dashoffset: 100; opacity: 1; }
      30%,68% { stroke-dashoffset: 0;   opacity: 1; }
      76%,100%{ stroke-dashoffset: 0;   opacity: 0; }
    }
    .note { opacity: 0; animation: note 9s linear infinite; }
    @keyframes note { 0%,32%{opacity:0} 38%,68%{opacity:1} 76%,100%{opacity:0} }
    .hdr { animation: fix 9s linear infinite; }
    @keyframes fix { 0%,58%{fill:#3b4048} 66%,92%{fill:#7c6cf0} 100%{fill:#3b4048} }
    .done { opacity: 0; animation: done 9s linear infinite; }
    @keyframes done { 0%,66%{opacity:0} 72%,92%{opacity:1} 97%,100%{opacity:0} }
  </style>

  <!-- browser window -->
  <rect x="0" y="0" width="340" height="170" rx="8" fill="#0d1117" stroke="#30363d"/>
  <rect x="0" y="0" width="340" height="26" rx="8" fill="#161b22"/>
  <rect x="0" y="18" width="340" height="8" fill="#161b22"/>
  <circle cx="16" cy="13" r="4" fill="#ff5f57"/>
  <circle cx="30" cy="13" r="4" fill="#febc2e"/>
  <circle cx="44" cy="13" r="4" fill="#28c840"/>
  <rect x="60" y="6" width="220" height="14" rx="7" fill="#0d1117"/>
  <text x="170" y="16" text-anchor="middle" fill="#8b949e" font-size="9">localhost:3000 · ainnotations</text>

  <!-- the page: a header that looks off, then gets fixed -->
  <rect class="hdr" x="14" y="38" width="200" height="26" rx="4"/>
  <rect x="14" y="76"  width="312" height="7" rx="2" fill="#21262d"/>
  <rect x="14" y="90"  width="280" height="7" rx="2" fill="#21262d"/>
  <rect x="14" y="104" width="300" height="7" rx="2" fill="#21262d"/>

  <!-- the user's freehand circle around the header -->
  <path class="scribble" pathLength="100" fill="none" stroke="#ff5f57" stroke-width="2.5" stroke-linecap="round"
        d="M 118 33 C 190 28, 228 40, 222 52 C 216 66, 130 72, 60 68 C 16 65, 4 54, 16 44 C 28 35, 80 30, 130 32"/>

  <!-- the note -->
  <g class="note">
    <line x1="226" y1="50" x2="248" y2="58" stroke="#ff5f57" stroke-width="2" stroke-linecap="round"/>
    <rect x="250" y="48" width="76" height="20" rx="4" fill="#161b22" stroke="#ff5f57"/>
    <text x="288" y="61" text-anchor="middle" fill="#e6edf3" font-size="9">too dull 🖊</text>
  </g>

  <!-- the agent applies it -->
  <text class="done" x="14" y="146" fill="#3fb950">✓ applied from annotations.md</text>
</svg>
