<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 312" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
  <style>
    .l { opacity: 0; animation: 16s linear infinite; }
    .l1 { animation-name: f1; }  .l2 { animation-name: f2; }
    .l3 { animation-name: f3; }  .l4 { animation-name: f4; }
    .l5 { animation-name: f5; }  .l6 { animation-name: f6; }
    .l7 { animation-name: f7; }  .l8 { animation-name: f8; }
    @keyframes f1 { 0%,2%{opacity:0}  4%,94%{opacity:1}  97%,100%{opacity:0} }
    @keyframes f2 { 0%,8%{opacity:0}  10%,94%{opacity:1} 97%,100%{opacity:0} }
    @keyframes f3 { 0%,17%{opacity:0} 19%,94%{opacity:1} 97%,100%{opacity:0} }
    @keyframes f4 { 0%,30%{opacity:0} 32%,94%{opacity:1} 97%,100%{opacity:0} }
    @keyframes f5 { 0%,45%{opacity:0} 47%,94%{opacity:1} 97%,100%{opacity:0} }
    @keyframes f6 { 0%,58%{opacity:0} 60%,94%{opacity:1} 97%,100%{opacity:0} }
    @keyframes f7 { 0%,64%{opacity:0} 66%,94%{opacity:1} 97%,100%{opacity:0} }
    @keyframes f8 { 0%,74%{opacity:0} 76%,94%{opacity:1} 97%,100%{opacity:0} }
    .caret { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
    .bar { transform-origin: bottom; transform: scaleY(0); animation: 16s ease-out infinite; }
    .b0 { animation-name: g0; } .b1 { animation-name: g1; }
    .b2 { animation-name: g2; } .b3 { animation-name: g3; }
    @keyframes g0 { 0%,20%{transform:scaleY(0)} 25%,94%{transform:scaleY(1)} 97%,100%{transform:scaleY(0)} }
    @keyframes g1 { 0%,48%{transform:scaleY(0)} 53%,94%{transform:scaleY(1)} 97%,100%{transform:scaleY(0)} }
    @keyframes g2 { 0%,61%{transform:scaleY(0)} 66%,94%{transform:scaleY(1)} 97%,100%{transform:scaleY(0)} }
    @keyframes g3 { 0%,76%{transform:scaleY(0)} 81%,94%{transform:scaleY(1)} 97%,100%{transform:scaleY(0)} }
  </style>

  <!-- terminal window -->
  <rect x="0" y="0" width="760" height="312" rx="10" fill="#0d1117" stroke="#30363d"/>
  <rect x="0" y="0" width="760" height="34" rx="10" fill="#161b22"/>
  <rect x="0" y="24" width="760" height="10" fill="#161b22"/>
  <circle cx="22" cy="17" r="5.5" fill="#ff5f57"/>
  <circle cx="42" cy="17" r="5.5" fill="#febc2e"/>
  <circle cx="62" cy="17" r="5.5" fill="#28c840"/>
  <text x="380" y="21" text-anchor="middle" fill="#8b949e" font-size="12">ai-scaffold</text>

  <!-- transcript -->
  <text class="l l1" x="26" y="66"  fill="#e6edf3"><tspan fill="#3fb950">$</tspan> /as-setup</text>
  <text class="l l2" x="26" y="92"  fill="#d29922">◆ ai-scaffold — raising the scaffolding (1 of 5)</text>
  <text class="l l3" x="26" y="118" fill="#e6edf3"><tspan fill="#a5a2ff">●</tspan> What do you do for a living?</text>
  <text class="l l4" x="26" y="144" fill="#8b949e">  › I design apps. Never wrote a line of code.</text>
  <text class="l l5" x="26" y="170" fill="#e6edf3"><tspan fill="#a5a2ff">●</tspan> Perfect starting point. That's what the scaffolding is for.</text>
  <text class="l l6" x="26" y="196" fill="#3fb950">  ✓ profile saved · starting level: discover</text>
  <text class="l l7" x="26" y="222" fill="#3fb950">  ✓ decision-ledger 0.2.0 found</text>
  <text class="l l8" x="26" y="248" fill="#e6edf3"><tspan fill="#a5a2ff">●</tspan> Next: run <tspan fill="#d29922">/as-project</tspan> in the repo you dream about.</text>
  <rect class="caret" x="26" y="262" width="8" height="15" fill="#e6edf3"/>

  <!-- the scaffold rises with the answers -->
  <g transform="translate(614,196)">
    <rect class="bar b0" x="0"  y="-22" width="24" height="88" fill="#21262d" stroke="#30363d"/>
    <rect class="bar b1" x="32" y="-44" width="24" height="110" fill="#2d333b" stroke="#30363d"/>
    <rect class="bar b2" x="64" y="-66" width="24" height="132" fill="#3b4048" stroke="#30363d"/>
    <rect class="bar b3" x="96" y="-88" width="24" height="154" fill="#7c6cf0" stroke="#a5a2ff"/>
    <text x="12"  y="80" text-anchor="middle" fill="#8b949e" font-size="10">0</text>
    <text x="44"  y="80" text-anchor="middle" fill="#8b949e" font-size="10">1</text>
    <text x="76"  y="80" text-anchor="middle" fill="#8b949e" font-size="10">2</text>
    <text x="108" y="80" text-anchor="middle" fill="#a5a2ff" font-size="10">3</text>
  </g>
</svg>
